replicaCount: 5

image:
  repository: janeczku/rancher-demo
  tag: "1.0.6"
  pullPolicy: IfNotPresent

app:
  title: "Rancher Demo App"
  pets: cows          # cows, chameleons ou cowmeleons
  color: black        # couleur CSS du fond des conteneurs

# NodePort : accessible sur http://<ip-d-un-noeud>:<nodePort>, sans DNS ni LoadBalancer
service:
  type: NodePort
  port: 8080
  nodePort: 30080

# Optionnel : nécessite un nom DNS qui pointe vers les nœuds
ingress:
  enabled: false
  host: rancher-demo.example.com
  className: ""

resources: {}
