# Valeurs par défaut génériques. La configuration d'une instance (nom du cluster,
# version, credential, image, réseau...) se fait dans fleet.yaml (helm.values).
# Les valeurs vides ci-dessous sont obligatoires : le rendu échoue si elles manquent.

cluster:
  name: ""
  # Lister les versions disponibles : curl -sk https://<rancher>/v1-rke2/releases | jq -r '.data[].id'
  kubernetesVersion: ""
  labels: {}
  annotations: {}
  cni: canal

# Nom du Secret (cattle-global-data) contenant le cloud credential Harvester (cc-xxxxx).
cloudCredentialSecretName: ""

# Cloud provider du cluster RKE2 :
#   ""          = "Default - RKE2 Embedded" (aucun secret supplémentaire)
#   "harvester" = CCM/CSI Harvester (LoadBalancer, stockage) ; requiert le secret ci-dessous
cloudProvider: ""

# Utilisé seulement si cloudProvider: harvester.
# Secret (namespace fleet-default) contenant le kubeconfig du cloud provider Harvester.
# Créé par scripts/harvester-secrets.sh cloudprovider. Vide = <cluster.name>-cloudprovider.
cloudProviderConfigSecretName: ""

# Valeurs communes à tous les pools, surchargeables pool par pool.
machineDefaults:
  vmNamespace: default
  cpuCount: 2
  memorySize: 4        # GiB
  diskSize: 40         # GiB
  imageName: ""        # <namespace>/<nom de la VMImage Harvester>
  networkName: ""      # <namespace>/<nom du VM network Harvester>
  sshUser: ""
  userData: |
    #cloud-config
    package_update: true
    packages:
      - qemu-guest-agent
      - iptables
    runcmd:
      - - systemctl
        - enable
        - '--now'
        - qemu-guest-agent.service

# Les listes ne sont pas fusionnées par Helm : redéfinir machinePools le remplace en entier.
machinePools:
  - name: node
    quantity: 1
    etcd: true
    controlplane: true
    worker: true
